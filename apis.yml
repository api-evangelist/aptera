name: Aptera
description: 'Aptera (Aptera Software, Inc.) was a custom software development consultancy
  based in Fort Wayne, Indiana, founded in 2003 and specializing in the Microsoft stack
  — .NET, SharePoint, Azure, business intelligence, and web and mobile application
  development, plus legacy application modernization, DevOps, UI/UX design, quality
  assurance, and security and compliance services for enterprise clients. It employed
  more than 100 people and was the largest web development firm in northeast Indiana
  before being acquired by IT services provider Core BTS on June 30, 2021, after which
  it ceased to operate as an independent brand. Battery Ventures lists "Aptera, Inc."
  on its all-companies page as an exited investment, which is how this record entered
  the API Evangelist network. Aptera was a services firm rather than an API producer:
  enrichment found no public API, developer portal, OpenAPI definition, SDK, webhook
  surface, or MCP server. Its only surviving public technical footprint is a GitHub
  organization of engineering-practice repositories (coding katas and workshop material).'
